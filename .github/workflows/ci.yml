name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_GMW_LAYER_ENABLED: ${{ vars.VITE_GMW_LAYER_ENABLED }}
          VITE_GMW_MAPBOX_TOKEN: ${{ vars.VITE_GMW_MAPBOX_TOKEN }}
          # Canonical data store (GLO-176). REQUIRED after the GLO-185 cutover:
          # this repo/environment variable must be set. There are no bundled
          # public/data/ copies to fall back to, so an empty value ships a build
          # that fails to load its data.
          VITE_DATA_STORE_URL: ${{ vars.VITE_DATA_STORE_URL }}
